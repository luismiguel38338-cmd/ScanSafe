<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09090b">
<title>RD Radio Live 🇩🇴</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #09090b;
  color: white;
  min-height: 100vh;
}

header {
  padding: 22px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #111116;
  position: sticky;
  top: 0;
  z-index: 10;
}

.logo {
  font-size: 22px;
  font-weight: 800;
}

.logo span {
  color: #ff1744;
}

.live {
  background: #ff1744;
  padding: 7px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: bold;
}

.hero {
  padding: 35px 20px 25px;
  text-align: center;
}

.hero h1 {
  font-size: 34px;
  margin-bottom: 10px;
}

.hero p {
  color: #aaa;
  font-size: 15px;
}

.player {
  margin: 10px 18px 30px;
  padding: 25px;
  background: linear-gradient(145deg, #19191f, #0f0f13);
  border-radius: 25px;
  text-align: center;
  box-shadow: 0 15px 40px rgba(0,0,0,.35);
}

.cover {
  width: 150px;
  height: 150px;
  border-radius: 22px;
  margin: auto;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 65px;
  background: linear-gradient(135deg, #ff1744, #7b1fa2);
}

.station-name {
  font-size: 22px;
  font-weight: bold;
  margin-top: 20px;
}

.status {
  color: #aaa;
  margin-top: 6px;
  font-size: 14px;
}

.play {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  border: none;
  margin-top: 20px;
  background: #ff1744;
  color: white;
  font-size: 28px;
  cursor: pointer;
  box-shadow: 0 8px 25px rgba(255,23,68,.35);
}

.volume {
  width: 100%;
  margin-top: 20px;
}

.section {
  padding: 0 18px 30px;
}

.section h2 {
  margin-bottom: 15px;
}

.search {
  width: 100%;
  padding: 15px;
  border: none;
  outline: none;
  border-radius: 14px;
  background: #19191f;
  color: white;
  margin-bottom: 18px;
  font-size: 15px;
}

.station {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px;
  margin-bottom: 10px;
  background: #15151a;
  border-radius: 16px;
  cursor: pointer;
  transition: .2s;
}

.station:active {
  transform: scale(.98);
}

.station-icon {
  width: 55px;
  height: 55px;
  border-radius: 14px;
  background: linear-gradient(135deg,#222,#ff1744);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 25px;
}

.info {
  flex: 1;
}

.info h3 {
  font-size: 16px;
}

.info p {
  color: #888;
  font-size: 12px;
  margin-top: 4px;
}

.favorite {
  font-size: 22px;
  color: #777;
}

.favorite.active {
  color: #ff1744;
}

footer {
  text-align: center;
  padding: 30px 15px;
  color: #666;
  font-size: 13px;
}

audio {
  display: none;
}
</style>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="logo">RD <span>RADIO</span></div>
  <div class="live">● EN VIVO</div>
</header>

<section class="hero">
  <h1>Radio Dominicana 🇩🇴</h1>
  <p>Tu música favorita, dondequiera que estés.</p>
</section>

<div class="player">

  <div class="cover" id="cover">📻</div>

  <div class="station-name" id="currentName">
    Selecciona una emisora
  </div>

  <div class="status" id="status">
    Listo para reproducir
  </div>

  <button class="play" onclick="togglePlay()" id="playButton">
    ▶
  </button>

  <input
    class="volume"
    type="range"
    min="0"
    max="1"
    step="0.01"
    value="0.8"
    onchange="changeVolume(this.value)"
  >

</div>

<section class="section">

  <h2>📻 Emisoras</h2>

  <input
    class="search"
    type="text"
    id="search"
    placeholder="Buscar emisora..."
    oninput="searchStations()"
  >

  <div id="stations"></div>

</section>

<footer>
  🇩🇴 RD Radio Live<br>
  Música dominicana en vivo
</footer>

<audio id="audio"></audio>

<script>

const stations = [

  {
    name: "Radio Dominicana 1",
    genre: "Música Tropical",
    url: "https://TU-URL-DE-STREAMING-AQUI"
  },

  {
    name: "Radio Dominicana 2",
    genre: "Bachata",
    url: "https://TU-URL-DE-STREAMING-AQUI"
  },

  {
    name: "Radio Dominicana 3",
    genre: "Merengue",
    url: "https://TU-URL-DE-STREAMING-AQUI"
  },

  {
    name: "Radio Dominicana 4",
    genre: "Urbana",
    url: "https://TU-URL-DE-STREAMING-AQUI"
  }

];

let currentStation = null;
let favorites = JSON.parse(
  localStorage.getItem("favorites") || "[]"
);

const audio = document.getElementById("audio");

function renderStations(list = stations) {

  const container = document.getElementById("stations");

  container.innerHTML = "";

  list.forEach((station, index) => {

    const isFavorite = favorites.includes(index);

    const div = document.createElement("div");

    div.className = "station";

    div.innerHTML = `
      <div class="station-icon">📻</div>

      <div class="info">
        <h3>${station.name}</h3>
        <p>${station.genre}</p>
      </div>

      <div
        class="favorite ${isFavorite ? "active" : ""}"
        onclick="toggleFavorite(event, ${index})"
      >
        ♥
      </div>
    `;

    div.onclick = () => playStation(index);

    container.appendChild(div);

  });
}

function playStation(index) {

  const station = stations[index];

  currentStation = index;

  audio.src = station.url;

  document.getElementById("currentName").textContent =
    station.name;

  document.getElementById("status").textContent =
    "Conectando...";

  audio.play()
    .then(() => {

      document.getElementById("status").textContent =
        "🔴 Reproduciendo en vivo";

      document.getElementById("playButton").textContent =
        "❚❚";

    })
    .catch(() => {

      document.getElementById("status").textContent =
        "No se pudo conectar al streaming";

    });
}

function togglePlay() {

  if (!currentStation) {

    playStation(0);

    return;

  }

  if (audio.paused) {

    audio.play();

    document.getElementById("playButton").textContent =
      "❚❚";

  } else {

    audio.pause();

    document.getElementById("playButton").textContent =
      "▶";

  }

}

function changeVolume(value) {
  audio.volume = value;
}

function toggleFavorite(event, index) {

  event.stopPropagation();

  if (favorites.includes(index)) {

    favorites = favorites.filter(
      item => item !== index
    );

  } else {

    favorites.push(index);

  }

  localStorage.setItem(
    "favorites",
    JSON.stringify(favorites)
  );

  renderStations();

}

function searchStations() {

  const query =
    document.getElementById("search")
    .value
    .toLowerCase();

  const filtered = stations.filter(station =>
    station.name.toLowerCase().includes(query) ||
    station.genre.toLowerCase().includes(query)
  );

  renderStations(filtered);

}

audio.addEventListener("error", () => {

  document.getElementById("status").textContent =
    "⚠️ Error con la señal";

  document.getElementById("playButton").textContent =
    "▶";

});

renderStations();

</script>

<script src="script.js"></script>
</body>
</html>
